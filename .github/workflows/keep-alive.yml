# Calls the ping() database function once a day so the free Supabase project
# doesn't pause for inactivity. You can also run it by hand from the Actions tab.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL              your Project URL, e.g. https://abcdefghijkl.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  your publishable key (sb_publishable_...)
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Say which secrets are missing (never prints their values)
          [ -z "$SUPABASE_URL" ] && echo "SUPABASE_URL secret is empty or missing"
          [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && echo "SUPABASE_PUBLISHABLE_KEY secret is empty or missing"

          # A space or new line pasted with a secret would break the request: take them out.
          # ${url%/} drops a trailing slash if you pasted one.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          key=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')

          # ping() takes nothing, so a plain GET is enough (no request body to get wrong)
          status=$(curl --silent --show-error --output response.txt --write-out "%{http_code}" --header "apikey: $key" "${url%/}/rest/v1/rpc/ping")

          echo "HTTP status: $status"
          cat response.txt
          echo
          [ "$status" -lt 400 ]
